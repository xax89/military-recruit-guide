<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>軍事知識小站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #1e3a5f 0%, #2d4f7a 100%);
    min-height: 100vh;
    padding: 60px 20px;
    color: #1a1b1c;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header { text-align: center; color: #fff; margin-bottom: 50px; }
  header h1 { font-size: 32px; margin-bottom: 12px; letter-spacing: 2px; }
  header p { font-size: 15px; opacity: 0.85; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 32px 28px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    min-height: 220px;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.25);
  }
  .card .icon { font-size: 36px; margin-bottom: 16px; }
  .card h2 { font-size: 20px; color: #1e3a5f; margin-bottom: 10px; }
  .card p {
    font-size: 14px;
    color: #5F6670;
    line-height: 1.7;
    flex: 1;
  }
  .card .go {
    margin-top: 18px;
    font-size: 14px;
    color: #1e3a5f;
    font-weight: 600;
  }
  footer {
    text-align: center;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    margin-top: 50px;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>軍事知識小站</h1>
      <p>三份整理好的筆記，點卡片進入</p>
    </header>

    <div class="grid">
      <a class="card" href="義務役新兵生存指南.html">
        <div class="icon">🎖️</div>
        <h2>義務役新兵生存指南</h2>
        <p>4 個月軍事訓練役的完整生存手冊：從行李清單、新訓五週、答數口令、軍歌完整歌詞、體能鑑測、部隊地圖、特殊軍種，到給女友篇與退伍省思。</p>
        <div class="go">進入指南 →</div>
      </a>

      <a class="card" href="各國軍階階梯圖.html">
        <div class="icon">🌐</div>
        <h2>各國軍階階梯圖</h2>
        <p>中華民國、美軍、解放軍、日本自衛隊四國軍階對照，含政戰官、士官長、連隊幹部說明。分頁籤切換，附跨國對照表。</p>
        <div class="go">進入對照 →</div>
      </a>

      <a class="card" href="軍階階級與職務對照圖.html">
        <div class="icon">📊</div>
        <h2>軍階階級與職務對照圖</h2>
        <p>單一頁面整理：將官、校官、尉官、士官、士兵的階級、佩章、常見職務（班長／排長／連長／士官長／政戰官）。</p>
        <div class="go">進入圖表 →</div>
      </a>
    </div>

    <footer>
      <p>筆記整理 · 2026</p>
    </footer>
  </div>
</body>
</html>
